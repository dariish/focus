<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/timer.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer - AeomA</title>
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        -webkit-app-region: drag; /* Makes window draggable (Electron-like, but won't work in regular browsers) */
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-main-300);
        color: var(--color-fg);
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        gap: 12px;
        height: 100vh;
        overflow: hidden;
        margin: 0;
      }
      button {
        -webkit-app-region: no-drag; /* Buttons should not be draggable */
      }
      #timer-display {
        font-size: 40px;
        font-weight: bold;
        font-family: "Archivo", sans-serif;
        font-variant-numeric: tabular-nums;
        color: var(--color-tertiary-500);
        line-height: 0.9;
      }
      #sequence-label {
        font-size: 14px;
        color: var(--color-stroke-600);
        font-weight: 300;
        margin-top: 2px;
      }
      .timer-container {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-width: 0;
      }
      .buttons {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
      }
      .buttons button {
        padding: 8px;
        border-radius: 50%;
        border: 1px solid var(--color-stroke-500);
        background: linear-gradient(
          to top right,
          var(--color-main-300),
          var(--color-main-500)
        );
        color: var(--color-fg);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease-out;
        position: relative;
        overflow: hidden;
        width: 32px;
        height: 32px;
      }
      .buttons button:hover {
        border-color: var(--color-stroke-500);
        background: linear-gradient(
          to top right,
          var(--color-main-600),
          var(--color-main-300)
        );
        transform: rotate(3deg);
      }
      .buttons button:active {
        transform: scale(0.9) rotate(0deg);
      }
      .buttons button::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to right,
          transparent,
          var(--color-main-800),
          transparent
        );
        opacity: 0.1;
        transform: translateX(-100%);
        transition: transform 0.5s ease-out;
      }
      .buttons button:hover::before {
        transform: translateX(100%);
      }
      #pause-btn.paused {
        border-color: var(--color-stroke-500);
      }
      #pause-btn.paused::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--color-contrast-600);
        opacity: 0.05;
        border-radius: 50%;
        pointer-events: none;
      }
      #pause-btn.paused:hover::after {
        opacity: 0.1;
      }
      #stop-btn {
        position: relative;
      }
      #stop-btn svg {
        width: 10px;
        height: 10px;
        fill: currentColor;
        color: var(--color-tertiary-500);
        transition: color 0.3s;
        position: relative;
        z-index: 10;
      }
      #stop-btn:active svg {
        color: #ef4444;
      }
      #pause-btn svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
        transition: color 0.3s;
        position: relative;
        z-index: 10;
      }
      #pause-icon {
        color: var(--color-tertiary-500);
      }
      #play-icon {
        color: var(--color-contrast-500);
      }
      /* Ensure icons can be toggled */
      #pause-btn #pause-icon[style*="display: none"] {
        display: none !important;
      }
      #pause-btn #play-icon[style*="display: block"] {
        display: block !important;
      }
      /* Circular progress indicator for stop button */
      .stop-progress {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
        z-index: 5;
      }
      .stop-progress circle {
        fill: none;
        stroke: #ef4444;
        stroke-width: 2.5;
        stroke-linecap: round;
        transition: stroke-dashoffset 0.075s;
      }
      .progress-bar-container {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: var(--color-stroke-500);
        opacity: 0.3;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--color-contrast-500),
          var(--color-contrast-600)
        );
        transition: width 0.3s ease;
        width: 0%;
      }
    </style>
  </head>
  <body class="timer-widget" id="popup-body">
    <div class="timer-container">
      <div id="timer-display">00:00</div>
      <div id="sequence-label"></div>
    </div>
    <div class="buttons">
      <button id="stop-btn" title="Stop" class="group">
        <svg class="stop-progress" viewBox="0 0 100 100" style="display: none">
          <circle
            cx="50"
            cy="50"
            r="45"
            stroke-dasharray="282.74"
            stroke-dashoffset="282.74"
          ></circle>
        </svg>
        <svg viewBox="0 0 24 24">
          <rect x="6" y="6" width="12" height="12" />
        </svg>
      </button>
      <button id="pause-btn" title="Pause/Play" class="group">
        <svg id="pause-icon" viewBox="0 0 24 24">
          <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
        </svg>
        <svg id="play-icon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <script>
      let isPaused = false;

      const timerDisplay = document.getElementById("timer-display");
      const sequenceLabel = document.getElementById("sequence-label");
      const pauseBtn = document.getElementById("pause-btn");
      const stopBtn = document.getElementById("stop-btn");
      const pauseIcon = document.getElementById("pause-icon");
      const playIcon = document.getElementById("play-icon");
      const progressBar = document.getElementById("progress-bar");

      // Ensure initial state
      if (pauseIcon) pauseIcon.style.display = "block";
      if (playIcon) playIcon.style.display = "none";

      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, "0")}:${String(secs).padStart(
          2,
          "0"
        )}`;
      }

      function sendMessage(type, data) {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type, data }, "*");
        }
      }

      pauseBtn.addEventListener("click", () => {
        sendMessage("TOGGLE_PAUSE", {});
      });

      stopBtn.addEventListener("click", () => {
        sendMessage("FINISH_TIMER", {});
      });

      // Listen for updates from main window
      window.addEventListener("message", (event) => {
        if (event.data.type === "TIMER_UPDATE") {
          const {
            displaySeconds,
            sequenceLabel: seqLabel,
            isPaused: paused,
            progress,
            theme,
          } = event.data.data;

          // Update theme
          if (theme) {
            document
              .getElementById("popup-body")
              .setAttribute("data-theme", theme);
          }

          timerDisplay.textContent = formatTime(displaySeconds);
          if (seqLabel) {
            sequenceLabel.textContent = seqLabel;
          } else {
            sequenceLabel.textContent = "";
          }
          isPaused = paused;
          if (paused) {
            if (pauseIcon) {
              pauseIcon.style.setProperty("display", "none", "important");
            }
            if (playIcon) {
              playIcon.style.setProperty("display", "block", "important");
            }
            pauseBtn.classList.add("paused");
          } else {
            if (pauseIcon) {
              pauseIcon.style.setProperty("display", "block", "important");
            }
            if (playIcon) {
              playIcon.style.setProperty("display", "none", "important");
            }
            pauseBtn.classList.remove("paused");
          }
          // Update progress bar
          if (progress !== undefined) {
            progressBar.style.width = `${Math.min(
              100,
              Math.max(0, progress)
            )}%`;
          }
        }
      });

      // Request initial state
      sendMessage("REQUEST_STATE", {});
    </script>
  </body>
</html>
